name: qingyun_app
description: "轻云 · 移动端云盘 —— 基于「轻云」高保真设计稿与 qingyun_ui_kit 组件骨架构建的 Flutter 双端应用。"
publish_to: none
version: 0.1.12+13

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # 设计系统：主题、组件、路由常量（见 docs/DESIGN_SPEC.md）
  qingyun_ui_kit:
    path: packages/qingyun_ui_kit

  # 路由（与 qingyun_ui_kit 的 QyRouter 骨架同版本线）
  go_router: ^14.0.0

  # 网络层（后端对接见 docs/BACKEND.md）
  dio: ^5.4.0

  # 登录凭证持久化（TokenStore；正式可升级 flutter_secure_storage）
  shared_preferences: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
