name: android-build

on:
  push:
    branches: [main, beta]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK (release)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.24.5
          cache: true

      - name: Pub get
        run: |
          if [ -f pubspec.lock ]; then
            flutter pub get
            git diff --exit-code -- pubspec.lock
          else
            flutter pub get
            echo "::warning::缺少 pubspec.lock，构建不可复现；请在本地用 Flutter 3.24.5 执行 flutter pub get 并提交"
          fi

      - name: Analyze
        run: flutter analyze

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: qingyun-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
