name: ios-build

on:
  push:
    branches: [main, beta]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build iOS IPA (release, unsigned)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.24.5
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: CocoaPods install
        run: |
          cd ios
          pod install

      - name: Debug xcconfig chain
        run: |
          echo '--- Runner.xcworkspace ---'
          ls -la ios/Runner.xcworkspace/contents.xcworkspacedata || true
          echo '--- Pods-Runner.release.xcconfig ---'
          cat "ios/Pods/Target Support Files/Pods-Runner/Pods-Runner.release.xcconfig" || true
          echo '--- Generated.xcconfig ---'
          cat ios/Flutter/Generated.xcconfig || true
          echo '--- ephemeral ---'
          ls -la ios/Flutter/ephemeral || true
          echo '--- Pods/Headers/Public ---'
          ls -la ios/Pods/Headers/Public 2>/dev/null || true

      - name: Analyze
        run: flutter analyze

      # 未签名构建：无需 Apple 证书；先编译出 Runner.app，再手工打包为 IPA
      - name: Build iOS app (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        run: |
          mkdir -p build/ios/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -qry qingyun-ios-unsigned.ipa Payload
          rm -rf Payload
          ls -la

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: qingyun-ios-ipa
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
