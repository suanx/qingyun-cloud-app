allprojects {
    repositories {
        google()
        mavenCentral()
        // flutter_pdfview 1.3.2 依赖 com.github.barteksc:android-pdf-viewer，
        // 该坐标只发布在 JitPack（Maven Central 无此包）。放在最后兜底，
        // 其余依赖仍优先从 google() / mavenCentral() 解析。
        maven { url 'https://jitpack.io' }
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
